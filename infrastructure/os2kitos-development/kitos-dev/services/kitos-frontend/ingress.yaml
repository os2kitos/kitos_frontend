apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: easy-hosting-issuer
  name: kitos-frontend
  namespace: kitos-dev
spec:
  rules:
  - host: kitos-dev.strongminds.tech
    http:
      paths:
      - backend:
          service:
            name: kitos-frontend
            port:
              name: http
        path: /
        pathType: Prefix
  - host: f7528dba-774b-4ecc-8627-ce14f8f3a7e8.os2kitos-development.strongminds.easyhosting.strongminds.dev
    http:
      paths:
      - backend:
          service:
            name: kitos-frontend
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - kitos-dev.strongminds.tech
    secretName: kitos-dev-strongminds-tech-tls
  - hosts:
    - f7528dba-774b-4ecc-8627-ce14f8f3a7e8.os2kitos-development.strongminds.easyhosting.strongminds.dev
    secretName: f7528dba-774b-4ecc-8627-ce14f8f3a7e8-os2kitos-development-strongminds-easyhosting-strongminds-dev-tls