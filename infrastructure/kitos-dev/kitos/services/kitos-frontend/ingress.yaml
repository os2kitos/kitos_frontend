apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: easy-hosting-issuer
  name: kitos-frontend
  namespace: kitos
spec:
  rules:
  - host: kitos-dev.strongminds.tech
    http:
      paths:
      - backend:
          service:
            name: kitos-frontend
            port:
              name: http
        path: /
        pathType: Prefix
  - host: bb461bb7-2424-411d-8f62-12edde1831f0.kitos-dev.strongminds.easyhosting.strongminds.dev
    http:
      paths:
      - backend:
          service:
            name: kitos-frontend
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - kitos-dev.strongminds.tech
    secretName: kitos-dev-strongminds-tech-tls
  - hosts:
    - bb461bb7-2424-411d-8f62-12edde1831f0.kitos-dev.strongminds.easyhosting.strongminds.dev
    secretName: bb461bb7-2424-411d-8f62-12edde1831f0-kitos-dev-strongminds-easyhosting-strongminds-dev-tls