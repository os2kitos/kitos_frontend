@if(initialized){ @if(formGroup){

<mat-form-field [formGroup]="formGroup">
  <mat-label>
    {{ text }}
    <app-recommended-badge [visible]="recommended" [filled]="recommendedFilled ?? (hasContent(formName ? formGroup.controls[formName].value : undefined))"></app-recommended-badge>
  </mat-label>
  <textarea
    #autosizeTextarea
    matInput
    cdkTextareaAutosize
    [cdkAutosizeMinRows]="autosizeMinRows"
    [cdkAutosizeMaxRows]="autosizeMaxRows"
    type="text"
    [formControlName]="formName"
    (input)="formInputValueChange($event)"
    (focus)="focus(true)"
    (blur)="focus(false)"
    [ngClass]="{ disabled: disabled }"
  ></textarea>
    @if (formName && formGroup.controls[formName].getError('maxlength'); as error) {
      <mat-error i18n>Maksimalt {{ error.requiredLength }} tegn.</mat-error>
    }
</mat-form-field>
} @else {
<mat-form-field>
  <mat-label>
    {{ text }}
    <app-recommended-badge [visible]="recommended" [filled]="recommendedFilled ?? (hasContent(value))"></app-recommended-badge>
  </mat-label>
  <textarea
    #autosizeTextarea
    matInput
    cdkTextareaAutosize
    [cdkAutosizeMinRows]="autosizeMinRows"
    [cdkAutosizeMaxRows]="autosizeMaxRows"
    type="text"
    [disabled]="disabled"
    [(ngModel)]="value"
    (ngModelChange)="valueChange.emit($event)"
    [ngClass]="{ disabled: disabled }"
  ></textarea>
</mat-form-field>
} }
